<!doctype html>
<!--
  ПРОТОТИП, одноразовый код. Приложением не импортируется и в сборку не входит.

  Вопрос: как выглядит «Астра» без нижнего меню — посреди неба горит звезда «Око»,
  касание проваливает в разговор с ним, вокруг летают звёзды разделов.

  Три варианта на одной странице: ?variant=A | B | C | all, ?still=1 — без движения.
  Запуск: python3 -m http.server 4781 --directory packages/frontend
          → http://localhost:4781/prototype/star-sky/

  Значения цвета, шрифта, радиусов и анимаций скопированы из src/index.css (@theme):
  прототип живёт отдельно от Tailwind-сборки, поэтому токены продублированы здесь.
-->
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Звёздное небо · прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --color-bg: #090909;
  --color-charcoal: #111111;
  --color-surface: #171717;
  --color-border: #222222;
  --color-muted: #333333;
  --color-fg-tertiary: #8c8c8c;
  --color-fg-secondary: #d9d9d9;
  --color-fg: #f4f2f5;
  --color-accent: #8b5cf6;
  --color-accent-text: #a88bfa;
  --color-accent-strong: #7c3aed;
  --color-aura-orchid: #c38bff;
  --color-star-core: #fffaf0;
  --color-star-halo: #ece0ff;
  --color-glass: rgba(255, 255, 255, 0.06);
  --color-hairline: color-mix(in srgb, var(--color-fg) 10%, transparent);
  --color-accent-muted: color-mix(in srgb, var(--color-accent) 15%, transparent);
  --color-accent-edge: color-mix(in srgb, var(--color-accent) 20%, transparent);
  --font-sans: 'Inter Variable', 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Geist Mono Variable', 'Geist Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  --radius-md: 16px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --shadow-float: 0 12px 12px rgb(0 0 0 / 0.5);
  --shadow-glass: var(--shadow-float), inset 0 1px 1px rgb(255 255 255 / 0.12), inset 0 -1px 1px rgb(0 0 0 / 0.4);
  --gradient-metal-sheen: linear-gradient(to right, transparent, color-mix(in srgb, var(--color-fg) 65%, transparent) 50%, transparent);
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: dark;
}

@keyframes star-twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.7; } }
@keyframes breath-pulse { 0%, 100% { opacity: 0.35; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.06); } }
@keyframes ring-rotation { to { transform: rotate(360deg); } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #000;
  color: var(--color-fg);
  font-family: var(--font-sans);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }

/* Ступени шкалы @theme */
.t-overline { font: 500 11px/1.4 var(--font-mono); letter-spacing: 2px; text-transform: uppercase; }
.t-caption { font-size: 12px; line-height: 1.35; }
.t-note { font-size: 13px; line-height: 18px; }
.t-label { font-size: 14px; line-height: 1.3; font-weight: 500; }
.t-body { font-size: 15px; line-height: 1.5; }
.t-h3 { font-size: 16px; line-height: 1.4; font-weight: 500; }
.t-h1 { font-size: 24px; line-height: 1.2; letter-spacing: -0.5px; font-weight: 500; }
.t-display-s { font-size: 42px; line-height: 1.1; font-weight: 500; }
.c-sec { color: var(--color-fg-secondary); }
.c-ter { color: var(--color-fg-tertiary); }

/* ───────── обвязка прототипа: не часть дизайна ───────── */
.proto-head {
  position: fixed; top: 14px; left: 20px; right: 20px; z-index: 50;
  display: flex; justify-content: space-between; align-items: baseline; gap: 24px;
  pointer-events: none; color: #6b6b6b;
}
.proto-head__note { font: 400 13px/18px var(--font-sans); color: #9a9a9a; text-align: right; max-width: 520px; }
.stage {
  position: fixed; inset: 52px 0 80px;
  display: flex; align-items: center; justify-content: center; gap: 28px;
}
.slot { position: relative; flex: none; }
.slot__label {
  position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 8px;
  text-align: center; color: #8c8c8c;
}
.switcher {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 100;
  display: flex; align-items: center; gap: 4px; padding: 6px;
  background: #f4f2f5; color: #0b0b0b; border-radius: 999px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  font: 500 13px/1 var(--font-mono); white-space: nowrap;
}
.sw-btn, .sw-toggle {
  height: 36px; min-width: 36px; padding: 0 12px; border: 0; border-radius: 999px;
  background: transparent; color: inherit; cursor: pointer; font: inherit;
}
.sw-btn { font-size: 18px; padding: 0; }
.sw-btn:hover, .sw-toggle:hover { background: rgba(0, 0, 0, 0.08); }
.sw-toggle[aria-pressed="true"] { background: #0b0b0b; color: #f4f2f5; }
.sw-label { min-width: 170px; text-align: center; }
.sw-sep { width: 1px; height: 20px; background: rgba(0, 0, 0, 0.2); margin: 0 4px; }
.switcher.is-bare {
  bottom: calc(env(safe-area-inset-bottom) + 18px);
  transform: translateX(-50%) scale(0.82); opacity: 0.9;
}
body:not([data-screen="sky"]) .switcher.is-bare { display: none; }
.switcher.is-bare .sw-sep, .switcher.is-bare .sw-toggle { display: none; }
.switcher.is-bare .sw-label { min-width: 120px; }

/* ───────── телефон ───────── */
.phone {
  --top: 54px;
  --bottom: 30px;
  position: absolute; left: 12px; top: 12px; width: 390px; height: 844px;
  transform-origin: 0 0; overflow: hidden; isolation: isolate;
  border-radius: 54px; background: var(--color-bg);
  box-shadow: 0 0 0 1px #262626, 0 0 0 11px #0f0f0f, 0 0 0 12px #2c2c2c, 0 40px 80px rgba(0, 0, 0, 0.7);
}
.phone--bare {
  --top: calc(env(safe-area-inset-top) + 12px);
  --bottom: calc(env(safe-area-inset-bottom) + 14px);
  position: fixed; left: 0; top: 0; width: 100vw; height: 100dvh;
  border-radius: 0; box-shadow: none; transform: none !important;
}
.device-island {
  position: absolute; top: 11px; left: 50%; width: 122px; height: 35px; margin-left: -61px;
  border-radius: 20px; background: #000; z-index: 90; pointer-events: none;
}
.device-time { position: absolute; top: 19px; left: 44px; z-index: 90; font: 600 15px/1 -apple-system, var(--font-sans); pointer-events: none; }
.device-batt {
  position: absolute; top: 20px; right: 36px; width: 24px; height: 12px; z-index: 90; pointer-events: none;
  border: 1px solid rgba(244, 242, 245, 0.5); border-radius: 4px; padding: 1.5px;
}
.device-batt::after { content: ''; display: block; height: 100%; width: 70%; background: var(--color-fg); border-radius: 2px; }
.device-home {
  position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px;
  border-radius: 3px; background: var(--color-fg); opacity: 0.55; z-index: 90; pointer-events: none;
}
.phone--bare .device-island, .phone--bare .device-time, .phone--bare .device-batt, .phone--bare .device-home { display: none; }

.scr { position: absolute; inset: 0; }
.scr[hidden] { display: none; }

/* ───────── небо ───────── */
.sky { overflow: hidden; }
.dust {
  position: absolute; inset: -20px; pointer-events: none;
  transition: transform 0.8s cubic-bezier(0.55, 0, 0.85, 0.35), opacity 0.8s ease-in;
}
.dust.is-warp { transform: scale(2.6); opacity: 0; }
.dust__layer { position: absolute; inset: 0; }
.dust i {
  position: absolute; width: 1px; height: 1px; border-radius: 50%;
  background: var(--color-fg); opacity: 0.15;
  animation: star-twinkle var(--d) ease-in-out var(--dl) infinite;
}
.dust i.b { width: 2px; height: 2px; }
.links, .trails { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.ln { stroke: var(--color-fg); stroke-opacity: 0.16; stroke-width: 1; }
.pulse { fill: var(--color-star-halo); }
.orb { fill: none; stroke: var(--color-fg); stroke-opacity: 0.1; stroke-width: 1; }
.orb--dots { stroke-opacity: 0.22; stroke-dasharray: 0.6 5; stroke-linecap: round; }

.topbar {
  position: absolute; left: 20px; right: 20px; top: calc(var(--top) + 6px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  transition: opacity 0.3s;
}
.sky.is-diving .topbar { opacity: 0; }
.avatar {
  width: 44px; height: 44px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 1px solid var(--color-border); background: var(--color-charcoal);
  color: var(--color-fg-secondary); font: 500 14px/1 var(--font-sans);
}
.avatar:active { transform: scale(0.94); }

.oko {
  position: absolute; width: 220px; height: 220px; margin: -110px 0 0 -110px;
  border: 0; padding: 0; background: none; border-radius: 50%; cursor: pointer; z-index: 5;
  -webkit-tap-highlight-color: transparent;
}
.oko__halo {
  position: absolute; inset: -46px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(236, 224, 255, 0.42) 0%, rgba(168, 139, 250, 0.2) 26%, rgba(139, 92, 246, 0.08) 46%, transparent 68%);
  animation: breath-pulse 4s ease-in-out infinite;
}
.oko__ticks { position: absolute; inset: 10px; color: var(--color-fg); opacity: 0.22; animation: ring-rotation 90s linear infinite; }
.oko__star {
  position: absolute; inset: 30px; overflow: visible;
  filter: drop-shadow(0 0 4px rgba(255, 250, 240, 0.9)) drop-shadow(0 0 16px rgba(236, 224, 255, 0.55)) drop-shadow(0 0 34px rgba(139, 92, 246, 0.5));
  transition: transform 0.2s var(--ease-out);
}
.oko:active .oko__star { transform: scale(0.93); }
.oko__caption {
  position: absolute; left: 50%; top: 186px; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 2px; white-space: nowrap;
  text-shadow: 0 0 12px var(--color-bg);
}
.oko__name { color: var(--color-fg); }
.oko:focus-visible, .sat:focus-visible, .avatar:focus-visible, .back:focus-visible, .q:focus-visible, .tab:focus-visible, .ask-oko:focus-visible {
  outline: 2px solid var(--color-accent-text); outline-offset: 3px;
}
.oko:focus-visible { outline-offset: -20px; }

.sat {
  position: absolute; left: 0; top: 0; width: 48px; height: 48px; margin: -24px 0 0 -24px;
  display: block; border: 0; padding: 0; background: none; cursor: pointer; z-index: 6;
  transform-origin: 24px 24px; will-change: transform, opacity; touch-action: none;
  -webkit-tap-highlight-color: transparent; border-radius: 50%;
}
.sat__star { width: 48px; height: 48px; display: grid; place-items: center; }
.sat__text { position: absolute; left: 50%; top: 50px; transform: translateX(-50%); }
.sat--up .sat__text { top: auto; bottom: 48px; }
.sat__star svg {
  width: var(--sz); height: var(--sz); overflow: visible;
  filter: drop-shadow(0 0 3px rgba(255, 250, 240, 0.85)) drop-shadow(0 0 12px rgba(236, 224, 255, 0.35));
  transition: transform 0.2s var(--ease-out);
}
.sat:active .sat__star svg { transform: scale(0.88); }
.sat__text { display: flex; flex-direction: column; align-items: center; gap: 1px; white-space: nowrap; text-shadow: 0 0 10px var(--color-bg), 0 0 4px var(--color-bg); }
.sat__label { display: flex; align-items: center; gap: 6px; color: var(--color-fg); }
.sat__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); }
.sat__meta { color: var(--color-fg-tertiary); }

.flash {
  position: absolute; z-index: 40; pointer-events: none; opacity: 0; border-radius: 50%;
  background: radial-gradient(circle, var(--color-star-core) 0%, var(--color-star-halo) 7%, rgba(195, 139, 255, 0.85) 15%, rgba(124, 58, 237, 0.5) 28%, rgba(9, 9, 9, 0.96) 48%, var(--color-bg) 56%);
}

/* ───────── общая шапка экранов ───────── */
.bar {
  position: absolute; left: 12px; right: 12px; top: calc(var(--top) + 2px); height: 48px; z-index: 10;
  display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
}
.bar__title { text-align: center; color: var(--color-fg-secondary); }
.back {
  width: 44px; height: 44px; border-radius: 50%; padding: 0; cursor: pointer;
  display: grid; place-items: center;
  border: 1px solid var(--color-border); background: var(--color-charcoal); color: var(--color-fg-secondary);
}
.back:active { transform: scale(0.94); }
.back svg { width: 20px; height: 20px; }
.scroll { position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* ───────── чат с Оком ───────── */
.chat .scroll { padding: calc(var(--top) + 60px) 20px calc(var(--bottom) + 84px); }
.chat__hero { position: relative; height: 140px; display: grid; place-items: center; }
.chat__hero .oko__halo { inset: 0; margin: auto; width: 180px; height: 180px; }
.chat__hero svg {
  position: relative; width: 104px; height: 104px; overflow: visible;
  filter: drop-shadow(0 0 4px rgba(255, 250, 240, 0.9)) drop-shadow(0 0 14px rgba(236, 224, 255, 0.5)) drop-shadow(0 0 28px rgba(139, 92, 246, 0.45));
}
.chat__intro { text-align: center; margin: 0 16px 24px; }
.anchor {
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px;
  padding: 6px 6px 6px 12px; border-radius: 999px;
  background: var(--color-accent-muted); border: 1px solid var(--color-accent-edge); color: var(--color-fg-secondary);
}
.anchor[hidden] { display: none; }
.anchor b { color: var(--color-fg); font-weight: 500; }
.anchor button { width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent; color: var(--color-fg-secondary); cursor: pointer; padding: 0; }
.tabs { display: flex; gap: 8px; margin: 12px 0 4px; overflow-x: auto; scrollbar-width: none; }
.tab {
  height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer; flex: none;
  border: 1px solid var(--color-border); background: transparent; color: var(--color-fg-secondary);
}
.tab[aria-selected="true"] { background: var(--color-accent-strong); border-color: var(--color-accent-strong); color: var(--color-fg); }
.qs { list-style: none; margin: 0; padding: 0; }
.q {
  width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 0; border: 0; border-bottom: 1px solid var(--color-border); background: none;
  color: var(--color-fg); text-align: left; cursor: pointer;
}
.q svg { flex: none; width: 16px; height: 16px; color: var(--color-fg-tertiary); }
.q:active { opacity: 0.6; }
.thread { display: flex; flex-direction: column; gap: 16px; }
.thread[hidden], .chat__list[hidden] { display: none; }
.bubble {
  align-self: flex-end; max-width: 82%; padding: 10px 14px;
  background: var(--color-surface); border-radius: 20px 20px 6px 20px; color: var(--color-fg);
}
.wait { display: flex; align-items: center; gap: 10px; }
.wait__dots { display: flex; gap: 5px; }
.wait__dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--color-star-halo); animation: star-twinkle 1.2s ease-in-out infinite; }
.wait__dots i:nth-child(2) { animation-delay: 0.2s; }
.wait__dots i:nth-child(3) { animation-delay: 0.4s; }
.answer p { margin: 6px 0 0; }
.link-btn {
  align-self: flex-start; height: 40px; padding: 0 16px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--color-border); background: transparent; color: var(--color-fg-secondary);
}
.composer {
  position: absolute; left: 16px; right: 16px; bottom: calc(var(--bottom) + 4px); height: 56px; z-index: 10;
  display: flex; align-items: center; gap: 8px; padding: 0 6px 0 20px;
  border-radius: 999px; border: 1px solid var(--color-border);
  background: color-mix(in srgb, var(--color-charcoal) 95%, transparent); box-shadow: var(--shadow-glass);
}
.composer input {
  flex: 1; min-width: 0; background: none; border: 0; outline: 0;
  color: var(--color-fg); font: 400 15px/1.5 var(--font-sans);
}
.composer input::placeholder { color: var(--color-fg-tertiary); }
.send {
  width: 44px; height: 44px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  display: grid; place-items: center; background: var(--color-surface); color: var(--color-fg-tertiary);
  transition: background 0.2s, color 0.2s;
}
.send svg { width: 20px; height: 20px; }
.send.is-ready { background: var(--color-accent); color: var(--color-fg); }

/* ───────── экран раздела ───────── */
.page .scroll { padding: calc(var(--top) + 64px) 20px calc(var(--bottom) + 96px); }
.page__title { margin: 0 0 20px; }
.page__h { margin: 20px 0 8px; }
.page p { margin: 0; }
.hero-img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radius-xl); background: var(--color-charcoal); }
.hero-img--wide { aspect-ratio: 4 / 3; }
.gap-s { height: 8px; }
.gap-m { height: 20px; }
.big3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
.tile {
  padding: 14px 12px; border-radius: var(--radius-lg);
  background: var(--color-charcoal); border: 1px solid var(--color-border);
  display: flex; flex-direction: column; gap: 8px;
}
.tile__glyph { font-size: 22px; line-height: 1; color: var(--color-fg-secondary); font-variant-emoji: text; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--color-border); }
.row__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row__val { font-family: var(--font-mono); color: var(--color-fg-secondary); font-size: 14px; }
.ava {
  width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
  border: 1px solid var(--color-border); background: var(--color-charcoal); color: var(--color-fg-secondary);
}
.outline-btn {
  width: 100%; height: 48px; margin-top: 20px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--color-border); background: transparent; color: var(--color-fg);
}
.ask-oko {
  position: absolute; left: 50%; bottom: calc(var(--bottom) + 4px); transform: translateX(-50%); z-index: 10;
  height: 56px; padding: 0 22px 0 14px; display: flex; align-items: center; gap: 10px;
  border-radius: 999px; border: 1px solid var(--color-border); cursor: pointer; white-space: nowrap;
  background: color-mix(in srgb, var(--color-charcoal) 95%, transparent); box-shadow: var(--shadow-glass);
  color: var(--color-fg);
}
.ask-oko[hidden] { display: none; }
.ask-oko svg {
  width: 30px; height: 30px; overflow: visible;
  filter: drop-shadow(0 0 3px rgba(255, 250, 240, 0.9)) drop-shadow(0 0 10px rgba(139, 92, 246, 0.6));
}
.ask-oko:active { transform: translateX(-50%) scale(0.97); }
.sheen { position: absolute; left: 22px; right: 22px; top: 0; height: 1px; background: var(--gradient-metal-sheen); opacity: 0.6; pointer-events: none; }

/* Статичный режим: системная настройка или переключатель прототипа */
.is-still .dust i, .is-still .oko__halo, .is-still .oko__ticks, .is-still .wait__dots i { animation: none !important; }
.is-still .oko__halo { opacity: 0.45; }
.is-still .dust i { opacity: 0.4; }
@media (prefers-reduced-motion: reduce) {
  .dust i, .oko__halo, .oko__ticks, .wait__dots i { animation: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ray-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--color-star-halo); stop-opacity: 0" />
      <stop offset="0.5" style="stop-color: var(--color-star-halo); stop-opacity: 0.95" />
      <stop offset="1" style="stop-color: var(--color-star-halo); stop-opacity: 0" />
    </linearGradient>
    <linearGradient id="ray-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" style="stop-color: var(--color-star-halo); stop-opacity: 0" />
      <stop offset="0.5" style="stop-color: var(--color-star-halo); stop-opacity: 0.95" />
      <stop offset="1" style="stop-color: var(--color-star-halo); stop-opacity: 0" />
    </linearGradient>
    <radialGradient id="g-star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: var(--color-star-core)" />
      <stop offset="0.55" style="stop-color: var(--color-star-halo)" />
      <stop offset="1" style="stop-color: var(--color-aura-orchid)" />
    </radialGradient>
    <radialGradient id="g-sat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" style="stop-color: var(--color-star-core)" />
      <stop offset="1" style="stop-color: var(--color-fg-secondary)" />
    </radialGradient>
    <filter id="f-soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" /></filter>
  </defs>
</svg>

<header class="proto-head">
  <span class="t-overline">Прототип · навигация звёздным небом</span>
  <span class="proto-head__note" id="note"></span>
</header>
<main class="stage" id="stage"></main>
<div class="switcher" id="switcher" role="toolbar" aria-label="Варианты прототипа">

</div>

<script>
(() => {
  'use strict';

  const MEDIA = 'assets';
  const VARIANTS = {
    A: { name: 'Созвездие', note: 'Разделы стоят на своих местах и связаны с Оком тонкими линиями, как созвездие. По линиям бежит свет, звёзды слегка покачиваются.' },
    B: { name: 'Орбиты', note: 'Разделы летают вокруг Ока по наклонным орбитам и проходят то перед ним, то за ним. Когда тянешься к звезде, орбиты замирают.' },
    C: { name: 'Свободный полёт', note: 'Связей нет: разделы сами дрейфуют по небу и оставляют след. Звезду можно схватить пальцем и отбросить.' },
  };
  const ORDER = ['A', 'B', 'C'];
  const SECTIONS = [
    { id: 'advice', label: 'Совет дня', meta: 'на сегодня', sz: 46, fresh: true },
    { id: 'chart', label: 'Натальная карта', meta: '☉︎ Скорпион · ☽︎ Рыбы', sz: 40 },
    { id: 'friends', label: 'Друзья', meta: '3 человека', sz: 34 },
  ];
  const ANCHORS_A = { advice: [0.68, 0.215], chart: [0.23, 0.36], friends: [0.7, 0.71] };
  const ORBITS_B = {
    advice: { rx: 0.36, k: 0.84, tilt: -14, per: 56, a0: -0.6, cls: 'orb' },
    chart: { rx: 0.425, k: 0.77, tilt: 18, per: 74, a0: 2.7, cls: 'orb orb--dots' },
    friends: { rx: 0.47, k: 0.82, tilt: -4, per: 96, a0: 1.25, cls: 'orb' },
  };
  const QUESTIONS = [
    { id: 'self', label: 'Я', qs: ['Почему я откладываю то, что для меня важно?', 'Что во мне мешает мне самому?', 'Откуда во мне столько требований к себе?', 'Почему мне трудно просить о помощи?'] },
    { id: 'love', label: 'Любовь', qs: ['Почему я выбираю одних и тех же людей?', 'Что я на самом деле ищу в отношениях?', 'Почему близость меня пугает?', 'Что я делаю, когда становится слишком близко?'] },
    { id: 'work', label: 'Работа', qs: ['В какой среде мне работается лучше всего?', 'Почему я бросаю начатое на середине?', 'Что мешает мне заявить о себе?', 'Почему чужой успех меня задевает?'] },
    { id: 'people', label: 'Люди', qs: ['Что люди во мне не понимают?', 'Почему я держу дистанцию?', 'Почему мне так важно нравиться?', 'Что я прячу от близких людей?'] },
  ];

  const STAR = (c, r, k) => `M${c} ${c - r}Q${c + k} ${c - k} ${c + r} ${c}Q${c + k} ${c + k} ${c} ${c + r}Q${c - k} ${c + k} ${c - r} ${c}Q${c - k} ${c - k} ${c} ${c - r}Z`;
  const okoStar = (cls = '') => `<svg class="${cls}" viewBox="0 0 200 200" aria-hidden="true">
    <rect x="99.6" y="0" width="0.8" height="200" fill="url(#ray-v)"/>
    <rect x="0" y="99.6" width="200" height="0.8" fill="url(#ray-h)"/>
    <rect x="99.7" y="44" width="0.6" height="112" fill="url(#ray-v)" opacity=".5" transform="rotate(45 100 100)"/>
    <rect x="99.7" y="44" width="0.6" height="112" fill="url(#ray-v)" opacity=".5" transform="rotate(-45 100 100)"/>
    <path d="${STAR(100, 44, 8)}" fill="url(#g-star)"/>
    <circle cx="100" cy="100" r="8" fill="#fffaf0" filter="url(#f-soft)"/>
  </svg>`;
  const satStar = () => `<svg viewBox="0 0 100 100" aria-hidden="true">
    <rect x="49.6" y="0" width="0.8" height="100" fill="url(#ray-v)" opacity=".8"/>
    <rect x="0" y="49.6" width="100" height="0.8" fill="url(#ray-h)" opacity=".8"/>
    <path d="${STAR(50, 30, 5.5)}" fill="url(#g-sat)"/>
  </svg>`;
  const ticks = (() => {
    let s = '<svg class="oko__ticks" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="none" stroke="currentColor" stroke-width=".6"/>';
    for (let i = 0; i < 120; i++) {
      const a = (i * 3 * Math.PI) / 180, len = i % 10 === 0 ? 7 : 3;
      const x1 = 100 + 96 * Math.cos(a), y1 = 100 + 96 * Math.sin(a);
      const x2 = 100 + (96 - len) * Math.cos(a), y2 = 100 + (96 - len) * Math.sin(a);
      s += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="currentColor" stroke-width=".6"/>`;
    }
    return s + '</svg>';
  })();
  const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>';
  const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  const ICON_CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>';

  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  function rng(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const PAGES = {
    advice: {
      title: 'Совет дня',
      ask: true,
      html: () => `
        <p class="t-overline c-ter">Пятница · 6 ноября</p>
        <div class="gap-s"></div>
        <img class="hero-img" src="${MEDIA}/media/daily-key.webp" alt="">
        <h2 class="t-h1 page__h">Доведи до конца одно дело</h2>
        <p class="t-body c-sec">Сегодня проще закончить начатое, чем браться за новое. Выбери одну задачу и закрой её до вечера — остальное подождёт.</p>
        <div class="gap-m"></div>
        <p class="t-caption c-ter">Текст — заглушка прототипа.</p>`,
    },
    chart: {
      title: 'Натальная карта',
      ask: true,
      html: () => `
        <img class="hero-img" src="${MEDIA}/media/sign-scorpio.webp" alt="">
        <div class="big3">
          ${[['Солнце', '☉', 'Скорпион'], ['Луна', '☽', 'Рыбы'], ['Асцендент', 'AC', 'Лев']].map(([o, g, s]) => `
            <div class="tile"><span class="t-overline c-ter" style="letter-spacing:1px">${o}</span><span class="tile__glyph">${g}︎</span><span class="t-label">${s}</span></div>`).join('')}
        </div>
        <div class="gap-m"></div>
        <p class="t-overline c-ter">Планеты</p>
        <ul class="rows">
          ${[['Меркурий', 'Стрелец', '3 дом'], ['Венера', 'Весы', '2 дом'], ['Марс', 'Козерог', '5 дом']].map(([p, s, h]) => `
            <li class="row"><span class="row__main"><span class="t-body">${p}</span><span class="t-caption c-ter">${s}</span></span><span class="row__val">${h}</span></li>`).join('')}
        </ul>`,
    },
    friends: {
      title: 'Друзья',
      ask: true,
      html: () => `
        <img class="hero-img hero-img--wide" src="${MEDIA}/pair-hero.webp" alt="">
        <div class="gap-m"></div>
        <ul class="rows">
          ${[['А', 'Аня', 'Близнецы', '82%'], ['Д', 'Дима', 'Телец', '64%'], ['К', 'Катя', 'Рыбы', '91%']].map(([i, n, s, v]) => `
            <li class="row"><span class="ava t-label">${i}</span><span class="row__main"><span class="t-body">${n}</span><span class="t-caption c-ter">${s}</span></span><span class="row__val">${v}</span></li>`).join('')}
        </ul>
        <button class="outline-btn t-label">Добавить человека</button>`,
    },
    profile: {
      title: 'Профиль',
      ask: false,
      html: () => `
        <ul class="rows">
          ${[['Имя', 'Максим'], ['Рождение', '14.11.1993 · 07:40'], ['Место', 'Москва'], ['Уведомления', 'в 09:00']].map(([k, v]) => `
            <li class="row"><span class="row__main"><span class="t-caption c-ter">${k}</span><span class="t-body">${v}</span></span></li>`).join('')}
        </ul>
        <button class="outline-btn t-label">Удалить профиль</button>`,
    },
  };

  const params = new URLSearchParams(location.search);
  let mode = ['A', 'B', 'C', 'all'].includes(params.get('variant')) ? params.get('variant') : 'A';
  let stillForced = params.get('still') === '1';
  const mq = matchMedia('(prefers-reduced-motion: reduce)');
  const isStill = () => stillForced || mq.matches;

  const stage = document.getElementById('stage');
  let phones = [];

  function mountPhone(host, key, { bare, index, withLabel }) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    if (withLabel) slot.innerHTML = `<div class="slot__label t-overline">${key} · ${VARIANTS[key].name}</div>`;
    const phone = document.createElement('div');
    phone.className = 'phone' + (bare ? ' phone--bare' : '');
    slot.append(phone);
    host.append(slot);

    const R = rng(7);
    let dust = '';
    for (let i = 0; i < 90; i++) {
      const b = R() < 0.12 ? 'b' : '';
      dust += `<i class="${b}" style="left:${(R() * 100).toFixed(2)}%;top:${(R() * 100).toFixed(2)}%;--d:${(3 + R() * 5).toFixed(1)}s;--dl:-${(R() * 8).toFixed(1)}s"></i>`;
    }

    phone.innerHTML = `
      <div class="device-island"></div><div class="device-time">9:41</div><div class="device-batt"></div><div class="device-home"></div>
      <section class="scr sky" aria-label="Небо">
        <div class="dust"><div class="dust__layer">${dust}</div></div>
        <canvas class="trails"></canvas>
        <svg class="links"></svg>
        <div class="topbar">
          <span class="t-overline c-ter">Пт · 6 ноября</span>
          <button class="avatar" aria-label="Профиль">М</button>
        </div>
        <button class="oko" aria-label="Око — спросить о себе">
          <span class="oko__halo"></span>
          ${ticks}
          ${okoStar('oko__star')}
          <span class="oko__caption"><span class="oko__name t-h1">Око</span><span class="t-caption c-ter">Спроси о себе</span></span>
        </button>
        ${SECTIONS.map((s) => `
          <button class="sat" data-id="${s.id}" aria-label="${s.label}">
            <span class="sat__star" style="--sz:${s.sz}px">${satStar()}</span>
            <span class="sat__text">
              <span class="sat__label t-label">${s.label}${s.fresh ? '<span class="sat__dot" aria-label="новый"></span>' : ''}</span>
              <span class="sat__meta t-caption">${s.meta}</span>
            </span>
          </button>`).join('')}
      </section>

      <section class="scr chat" hidden aria-label="Око">
        <div class="scroll">
          <div class="chat__hero"><span class="oko__halo"></span>${okoStar()}</div>
          <p class="chat__intro t-body c-sec">Я вижу твою натальную карту целиком. Спроси о себе — отвечу по ней.</p>
          <div class="anchor t-note" hidden><span>Про: <b class="anchor__name"></b></span><button aria-label="Убрать">✕</button></div>
          <div class="chat__list">
            <p class="t-overline c-ter">С чего начать</p>
            <div class="tabs" role="tablist"></div>
            <ul class="qs"></ul>
          </div>
          <div class="thread" hidden></div>
        </div>
        <div class="bar"><button class="back" aria-label="К небу">${ICON_BACK}</button><span class="bar__title t-label">Око</span><span></span></div>
        <form class="composer"><span class="sheen"></span><input type="text" placeholder="Свой вопрос" aria-label="Свой вопрос" /><button class="send" type="submit" aria-label="Спросить">${ICON_UP}</button></form>
      </section>

      <section class="scr page" hidden>
        <div class="scroll"><h1 class="page__title t-display-s"></h1><div class="page__body"></div></div>
        <div class="bar"><button class="back" aria-label="К небу">${ICON_BACK}</button><span></span><span></span></div>
        <button class="ask-oko t-label"><span class="sheen"></span>${okoStar()}<span>Спросить Око об этом</span></button>
      </section>

      <div class="flash"></div>`;

    const W = phone.offsetWidth, H = phone.offsetHeight;
    const C = { x: W / 2, y: H * 0.47 };
    const $ = (sel) => phone.querySelector(sel);
    const sky = $('.sky'), chat = $('.chat'), page = $('.page');
    const screens = { sky, chat, page };
    const dustEl = $('.dust'), dustLayer = $('.dust__layer');
    const links = $('.links'), trails = $('.trails');
    const oko = $('.oko'), okoCaption = $('.oko__caption'), flash = $('.flash');
    links.setAttribute('viewBox', `0 0 ${W} ${H}`);
    links.setAttribute('width', W);
    links.setAttribute('height', H);
    oko.style.left = C.x + 'px';
    oko.style.top = C.y + 'px';

    const sats = SECTIONS.map((s, i) => {
      const el = phone.querySelector(`.sat[data-id="${s.id}"]`);
      const [fx, fy] = ANCHORS_A[s.id];
      const o = ORBITS_B[s.id];
      return {
        ...s, i, el, text: el.querySelector('.sat__text'), star: el.querySelector('svg'),
        ax: fx * W, ay: fy * H, x: fx * W, y: fy * H, vx: 0, vy: 0,
        heading: R() * Math.PI * 2, theta: o.a0, hist: [], lw: 0, dragging: false, justDragged: false,
        ph: R() * 10,
      };
    });
    // В созвездии линия приходит к звезде со стороны Ока — подпись уходит на дальнюю сторону.
    if (key === 'A') sats.forEach((s) => s.el.classList.toggle('sat--up', s.ay < C.y));
    const measure = () => sats.forEach((s) => (s.lw = s.text.offsetWidth));
    measure();
    document.fonts && document.fonts.ready.then(measure);

    if (key === 'A') {
      links.innerHTML = sats.map((s) => `<line class="ln" data-l="${s.id}"/><circle class="pulse" data-p="${s.id}" r="1.6"/>`).join('');
    } else if (key === 'B') {
      links.innerHTML = sats.map((s) => {
        const o = ORBITS_B[s.id], rx = o.rx * W, ry = rx * o.k;
        return `<ellipse class="${o.cls}" cx="${C.x}" cy="${C.y}" rx="${rx}" ry="${ry}" transform="rotate(${o.tilt} ${C.x} ${C.y})"/>`;
      }).join('');
    }
    const lineEls = key === 'A' ? sats.map((s) => [links.querySelector(`[data-l="${s.id}"]`), links.querySelector(`[data-p="${s.id}"]`)]) : [];

    const dpr = Math.min(2, devicePixelRatio || 1);
    trails.width = W * dpr;
    trails.height = H * dpr;
    trails.style.width = W + 'px';
    trails.style.height = H + 'px';
    const ctx = trails.getContext('2d');
    ctx.scale(dpr, dpr);

    // ───── анимационный цикл неба ─────
    let raf = 0, last = performance.now();
    let revealStart = last, dive = null, speed = 1, hold = 0;
    let par = { x: 0, y: 0, tx: 0, ty: 0 };

    function frame(now) {
      raf = requestAnimationFrame(frame);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (sky.hidden) return;
      const t = now / 1000;
      const still = isStill();

      speed += ((hold > 0 || dive ? 0 : 1) - speed) * Math.min(1, dt * 3);

      for (const s of sats) {
        let x, y, sc = 1, al = 1, z = 6;
        if (key === 'A') {
          x = s.ax + (still ? 0 : 9 * Math.sin((t * 2 * Math.PI) / (9 + s.i * 2) + s.ph));
          y = s.ay + (still ? 0 : 9 * Math.cos((t * 2 * Math.PI) / (11 + s.i * 2) + s.ph * 1.3));
        } else if (key === 'B') {
          const o = ORBITS_B[s.id];
          if (!still) s.theta += ((2 * Math.PI) / o.per) * speed * dt;
          const rx = o.rx * W, ry = rx * o.k, tl = (o.tilt * Math.PI) / 180;
          const lx = rx * Math.cos(s.theta), ly = ry * Math.sin(s.theta);
          x = C.x + lx * Math.cos(tl) - ly * Math.sin(tl);
          y = C.y + lx * Math.sin(tl) + ly * Math.cos(tl);
          const depth = Math.sin(s.theta);
          sc = 0.9 + 0.1 * depth;
          al = 0.72 + 0.28 * ((depth + 1) / 2);
          z = depth < 0 ? 4 : 6;
        } else {
          if (still) {
            s.x = s.ax; s.y = s.ay;
          } else if (!s.dragging) {
            physics(s, dt, t);
          }
          x = s.x; y = s.y;
        }

        if (!still) {
          const rp = easeOut(clamp((now - revealStart - 180 - s.i * 120) / 520));
          x = C.x + (x - C.x) * (0.55 + 0.45 * rp);
          y = C.y + (y - C.y) * (0.55 + 0.45 * rp);
          al *= rp;
        }
        if (dive && dive.originId !== s.id) {
          const p = clamp((now - dive.start) / dive.dur);
          const f = 1 + 2.4 * p * p;
          x = dive.O.x + (x - dive.O.x) * f;
          y = dive.O.y + (y - dive.O.y) * f;
          al *= 1 - p;
        }
        s.px = x; s.py = y; s.alpha = al;

        const half = (s.lw * sc) / 2;
        let shift = 0;
        if (x - half < 12) shift = 12 - (x - half);
        else if (x + half > W - 12) shift = W - 12 - (x + half);
        s.text.style.transform = `translateX(calc(-50% + ${shift / sc}px))`;
        s.el.style.transform = `translate(${x}px, ${y}px) scale(${sc})`;
        s.el.style.opacity = al;
        s.el.style.zIndex = z;
      }

      if (key === 'A') {
        lineEls.forEach(([ln, pu], i) => {
          const s = sats[i];
          const dx = s.px - C.x, dy = s.py - C.y, d = Math.hypot(dx, dy) || 1;
          const ux = dx / d, uy = dy / d;
          const x1 = C.x + ux * 64, y1 = C.y + uy * 64;
          const x2 = s.px - ux * (s.sz * 0.36 + 6), y2 = s.py - uy * (s.sz * 0.36 + 6);
          ln.setAttribute('x1', x1); ln.setAttribute('y1', y1);
          ln.setAttribute('x2', x2); ln.setAttribute('y2', y2);
          ln.style.opacity = s.alpha;
          if (still) { pu.style.opacity = 0; return; }
          const u = ((t + i * 1.3) / 3.6) % 1;
          pu.setAttribute('cx', x1 + (x2 - x1) * u);
          pu.setAttribute('cy', y1 + (y2 - y1) * u);
          pu.style.opacity = Math.sin(Math.PI * u) * 0.9 * s.alpha;
        });
      }

      if (key === 'C') {
        ctx.clearRect(0, 0, W, H);
        if (!still) {
          for (const s of sats) {
            s.hist.push([s.px, s.py]);
            if (s.hist.length > 46) s.hist.shift();
            for (let k = 1; k < s.hist.length; k++) {
              const a = (k / s.hist.length) * 0.28 * s.alpha;
              ctx.strokeStyle = `rgba(236, 224, 255, ${a})`;
              ctx.lineWidth = 1.2;
              ctx.beginPath();
              ctx.moveTo(s.hist[k - 1][0], s.hist[k - 1][1]);
              ctx.lineTo(s.hist[k][0], s.hist[k][1]);
              ctx.stroke();
            }
          }
        }
      }

      if (!still) {
        par.x += (par.tx - par.x) * Math.min(1, dt * 2);
        par.y += (par.ty - par.y) * Math.min(1, dt * 2);
        dustLayer.style.transform = `translate(${par.x}px, ${par.y}px)`;
      }
    }

    function physics(s, dt, t) {
      const cruise = 16;
      s.heading += (Math.sin(t * 0.35 + s.ph) * 0.7 + (R() - 0.5) * 0.9) * dt;
      let ax = (Math.cos(s.heading) * cruise - s.vx) * 0.9;
      let ay = (Math.sin(s.heading) * cruise - s.vy) * 0.9;
      const sp = Math.hypot(s.vx, s.vy);
      if (sp > cruise * 1.6) { ax = -s.vx * 1.6; ay = -s.vy * 1.6; }
      const dx = s.x - C.x, dy = s.y - C.y, d = Math.hypot(dx, dy) || 1;
      if (d < 165) { const f = (165 - d) * 2.4; ax += (dx / d) * f; ay += (dy / d) * f; }
      const L = 64, Rr = W - 64, T = 150, B = H - 120;
      if (s.x < L) ax += (L - s.x) * 1.6;
      if (s.x > Rr) ax -= (s.x - Rr) * 1.6;
      if (s.y < T) ay += (T - s.y) * 1.6;
      if (s.y > B) ay -= (s.y - B) * 1.6;
      for (const o of sats) {
        if (o === s) continue;
        const ex = s.x - o.x, ey = s.y - o.y, e = Math.hypot(ex, ey) || 1;
        if (e < 130) { const f = (130 - e) * 1.4; ax += (ex / e) * f; ay += (ey / e) * f; }
      }
      s.vx += ax * dt; s.vy += ay * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x < 24) { s.x = 24; s.vx = Math.abs(s.vx) * 0.6; }
      if (s.x > W - 24) { s.x = W - 24; s.vx = -Math.abs(s.vx) * 0.6; }
      if (s.y < 110) { s.y = 110; s.vy = Math.abs(s.vy) * 0.6; }
      if (s.y > H - 70) { s.y = H - 70; s.vy = -Math.abs(s.vy) * 0.6; }
    }

    // ───── координаты и переходы ─────
    const scaleNow = () => phone.getBoundingClientRect().width / W;
    function ptOf(el) {
      const pr = phone.getBoundingClientRect(), r = el.getBoundingClientRect(), s = pr.width / W;
      return { x: (r.left + r.width / 2 - pr.left) / s, y: (r.top + r.height / 2 - pr.top) / s };
    }
    function localPt(e) {
      const pr = phone.getBoundingClientRect(), s = pr.width / W;
      return { x: (e.clientX - pr.left) / s, y: (e.clientY - pr.top) / s };
    }

    let busy = false;
    const stack = ['sky'];

    async function crossfade(from, to) {
      const a = from.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 140, fill: 'forwards' });
      await a.finished;
      from.hidden = true; a.cancel();
      to.hidden = false;
      await to.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 140 }).finished;
    }

    async function diveFx(from, to, starEl, labelEl, O, originId) {
      const dur = 780;
      const anims = [];
      const D = 2 * Math.hypot(Math.max(O.x, W - O.x), Math.max(O.y, H - O.y));
      Object.assign(flash.style, { width: D + 'px', height: D + 'px', left: O.x - D / 2 + 'px', top: O.y - D / 2 + 'px' });
      if (from === sky) {
        dive = { start: performance.now(), dur, originId, O };
        sky.classList.add('is-diving');
        dustEl.style.transformOrigin = `${O.x + 20}px ${O.y + 20}px`;
        dustEl.classList.add('is-warp');
        if (originId !== 'oko') anims.push(oko.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.6)' }], { duration: dur * 0.7, easing: 'ease-in', fill: 'forwards' }));
        anims.push(links.animate([{ opacity: 1 }, { opacity: 0 }], { duration: dur * 0.5, fill: 'forwards' }));
      } else {
        anims.push(from.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.96)' }], { duration: dur, easing: 'ease-in', fill: 'forwards' }));
      }
      if (labelEl) anims.push(labelEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: 'forwards' }));
      anims.push(starEl.animate([{ transform: 'scale(1)' }, { transform: 'scale(9)' }], { duration: dur, easing: 'cubic-bezier(.55,0,.85,.35)', fill: 'forwards' }));
      const fin = flash.animate([{ opacity: 0, transform: 'scale(.06)' }, { opacity: 1, transform: 'scale(1)' }], { duration: dur, easing: 'cubic-bezier(.5,0,.8,.4)', fill: 'forwards' });
      await fin.finished;

      from.hidden = true;
      to.hidden = false;
      anims.forEach((a) => a.cancel());
      sky.classList.remove('is-diving');
      dustEl.classList.remove('is-warp');
      dive = null;
      to.animate([{ opacity: 0, transform: 'scale(1.05)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 600, easing: 'cubic-bezier(.2,.8,.2,1)' });
      const fout = flash.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.3)' }], { duration: 620, easing: 'ease-out', fill: 'forwards' });
      await fout.finished;
      fin.cancel(); fout.cancel();
    }

    async function riseFx(from, to) {
      const out = from.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.92)' }], { duration: 300, easing: 'cubic-bezier(.4,0,1,1)', fill: 'forwards' });
      await out.finished;
      from.hidden = true; out.cancel();
      to.hidden = false;
      if (to === sky) {
        revealStart = performance.now();
        sats.forEach((s) => (s.hist = []));
        oko.animate([{ opacity: 0, transform: 'scale(1.25)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 650, easing: 'cubic-bezier(.2,.8,.2,1)' });
        dustEl.animate([{ opacity: 0, transform: 'scale(1.3)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)' });
      } else {
        await to.animate([{ opacity: 0, transform: 'scale(1.04)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 420, easing: 'cubic-bezier(.2,.8,.2,1)' }).finished;
      }
    }

    async function go(target, { starEl, labelEl, originId, pageId, anchor }) {
      if (busy) return;
      busy = true;
      const from = screens[stack[stack.length - 1]];
      const to = screens[target];
      document.body.dataset.screen = target;
      if (target === 'chat') prepChat(anchor);
      else prepPage(pageId);
      const O = ptOf(starEl);
      if (isStill()) await crossfade(from, to);
      else await diveFx(from, to, starEl, labelEl, O, originId);
      stack.push(target);
      to.querySelector('.back').focus({ preventScroll: true });
      busy = false;
    }

    async function back() {
      if (busy || stack.length < 2) return;
      busy = true;
      const from = screens[stack.pop()];
      const to = screens[stack[stack.length - 1]];
      document.body.dataset.screen = stack[stack.length - 1];
      if (isStill()) await crossfade(from, to);
      else await riseFx(from, to);
      busy = false;
    }

    // ───── чат ─────
    let group = 'self';
    const tabsEl = $('.tabs'), qsEl = $('.qs'), thread = $('.thread'), list = $('.chat__list');
    const input = $('.composer input'), send = $('.send'), anchorEl = $('.anchor');
    function renderQs() {
      tabsEl.innerHTML = QUESTIONS.map((g) => `<button class="tab t-label" role="tab" data-g="${g.id}" aria-selected="${g.id === group}">${g.label}</button>`).join('');
      qsEl.innerHTML = QUESTIONS.find((g) => g.id === group).qs.map((q) => `<li><button class="q t-body">${esc(q)}${ICON_CHEV}</button></li>`).join('');
    }
    function prepChat(anchor) {
      list.hidden = false;
      thread.hidden = true;
      thread.innerHTML = '';
      input.value = '';
      send.classList.remove('is-ready');
      anchorEl.hidden = !anchor;
      if (anchor) anchorEl.querySelector('.anchor__name').textContent = anchor;
      chat.querySelector('.scroll').scrollTop = 0;
      renderQs();
    }
    function ask(text) {
      list.hidden = true;
      thread.hidden = false;
      thread.innerHTML = `<div class="bubble t-body">${esc(text)}</div>
        <div class="wait"><span class="wait__dots"><i></i><i></i><i></i></span><span class="t-caption c-ter">Око смотрит в твою карту</span></div>`;
      setTimeout(() => {
        const w = thread.querySelector('.wait');
        if (!w) return;
        w.outerHTML = `<div class="answer"><p class="t-overline c-ter">Око</p><p class="t-body c-sec">Здесь встанет ответ по твоей натальной карте. Прототип в сеть не ходит — он показывает только, где ответ живёт на экране и как до него добраться.</p></div>
          <button class="link-btn t-label" data-act="more">Другой вопрос</button>`;
      }, isStill() ? 300 : 1600);
    }
    tabsEl.addEventListener('click', (e) => {
      const b = e.target.closest('.tab');
      if (b) { group = b.dataset.g; renderQs(); }
    });
    qsEl.addEventListener('click', (e) => {
      const b = e.target.closest('.q');
      if (b) ask(b.textContent.trim());
    });
    thread.addEventListener('click', (e) => {
      if (e.target.closest('[data-act="more"]')) { thread.hidden = true; list.hidden = false; }
    });
    input.addEventListener('input', () => send.classList.toggle('is-ready', input.value.trim().length > 0));
    $('.composer').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!input.value.trim()) return;
      ask(input.value.trim());
      input.value = '';
      send.classList.remove('is-ready');
    });
    anchorEl.querySelector('button').addEventListener('click', () => (anchorEl.hidden = true));

    // ───── раздел ─────
    let currentPage = null;
    function prepPage(id) {
      currentPage = id;
      const p = PAGES[id];
      page.setAttribute('aria-label', p.title);
      page.querySelector('.page__title').textContent = p.title;
      page.querySelector('.page__body').innerHTML = p.html();
      page.querySelector('.ask-oko').hidden = !p.ask;
      page.querySelector('.scroll').scrollTop = 0;
    }
    page.querySelector('.ask-oko').addEventListener('click', (e) => {
      const btn = e.currentTarget;
      go('chat', { starEl: btn.querySelector('svg'), originId: 'ask', anchor: PAGES[currentPage].title });
    });
    phone.querySelectorAll('.back').forEach((b) => b.addEventListener('click', back));
    phone.addEventListener('keydown', (e) => { if (e.key === 'Escape') back(); });

    // ───── небо: касания ─────
    oko.addEventListener('click', () => go('chat', { starEl: oko.querySelector('.oko__star'), labelEl: okoCaption, originId: 'oko', anchor: null }));
    $('.avatar').addEventListener('click', (e) => go('page', { starEl: e.currentTarget, originId: 'profile', pageId: 'profile' }));

    for (const s of sats) {
      s.el.addEventListener('click', () => {
        if (s.justDragged) { s.justDragged = false; return; }
        go('page', { starEl: s.star, labelEl: s.text, originId: s.id, pageId: s.id });
      });
      s.el.addEventListener('pointerenter', () => hold++);
      s.el.addEventListener('pointerleave', () => (hold = Math.max(0, hold - 1)));
      s.el.addEventListener('focus', () => hold++);
      s.el.addEventListener('blur', () => (hold = Math.max(0, hold - 1)));
      if (key !== 'C') continue;
      let start = null, samples = [];
      s.el.addEventListener('pointerdown', (e) => {
        if (isStill()) return;
        start = localPt(e);
        samples = [{ ...start, t: performance.now() }];
        s.el.setPointerCapture(e.pointerId);
      });
      s.el.addEventListener('pointermove', (e) => {
        if (!start) return;
        const p = localPt(e);
        if (!s.dragging && Math.hypot(p.x - start.x, p.y - start.y) > 6) s.dragging = true;
        if (s.dragging) {
          s.x = p.x; s.y = p.y + 2;
          samples.push({ ...p, t: performance.now() });
          if (samples.length > 6) samples.shift();
        }
      });
      const end = () => {
        if (!start) return;
        if (s.dragging) {
          const a = samples[0], b = samples[samples.length - 1], dtm = Math.max(16, b.t - a.t) / 1000;
          s.vx = clamp((b.x - a.x) / dtm, -900, 900);
          s.vy = clamp((b.y - a.y) / dtm, -900, 900);
          s.justDragged = true;
          s.dragging = false;
        }
        start = null;
      };
      s.el.addEventListener('pointerup', end);
      s.el.addEventListener('pointercancel', end);
    }

    phone.addEventListener('pointermove', (e) => {
      const p = localPt(e);
      par.tx = -((p.x - W / 2) / W) * 10;
      par.ty = -((p.y - H / 2) / H) * 10;
    });

    if (!isStill()) oko.animate([{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 700, easing: 'cubic-bezier(.2,.8,.2,1)' });
    raf = requestAnimationFrame(frame);

    return {
      slot, phone, W, H,
      replay() { revealStart = performance.now(); },
      destroy() { cancelAnimationFrame(raf); slot.remove(); },
    };
  }

  // ───── обвязка прототипа ─────
  function layout() {
    if (!phones.length || phones[0].phone.classList.contains('phone--bare')) return;
    const n = phones.length, FW = 390 + 24, FH = 844 + 24, gap = 28;
    const availW = stage.clientWidth - 32, availH = stage.clientHeight - (n > 1 ? 28 : 0);
    const s = Math.min(1, availH / FH, (availW - gap * (n - 1)) / (n * FW));
    for (const p of phones) {
      p.slot.style.width = FW * s + 'px';
      p.slot.style.height = FH * s + 'px';
      p.phone.style.left = 12 * s + 'px';
      p.phone.style.top = 12 * s + 'px';
      p.phone.style.transform = `scale(${s})`;
    }
    stage.style.paddingTop = n > 1 ? '28px' : '0';
  }

  function render() {
    phones.forEach((p) => p.destroy());
    phones = [];
    document.body.dataset.screen = 'sky';
    const bare = innerWidth < 520 && mode !== 'all';
    document.body.classList.toggle('is-still', isStill());
    stage.style.inset = bare ? '0' : '';
    document.querySelector('.proto-head').style.display = bare ? 'none' : '';
    const keys = mode === 'all' ? ORDER : [mode];
    keys.forEach((k, i) => phones.push(mountPhone(stage, k, { bare, index: i, withLabel: mode === 'all' })));
    layout();
    const sw = document.getElementById('switcher');
    sw.classList.toggle('is-bare', bare);
    document.getElementById('sw-label').textContent = mode === 'all' ? 'Все три рядом' : `${mode} · ${VARIANTS[mode].name}`;
    document.getElementById('note').textContent = mode === 'all' ? 'Три варианта рядом. Каждый телефон живой: касание звезды проваливает в раздел или в Око.' : VARIANTS[mode].note;
    sw.querySelector('[data-act="all"]').setAttribute('aria-pressed', String(mode === 'all'));
    sw.querySelector('[data-act="still"]').setAttribute('aria-pressed', String(stillForced));
    const q = new URLSearchParams();
    q.set('variant', mode);
    if (stillForced) q.set('still', '1');
    history.replaceState(null, '', '?' + q.toString());
  }

  function step(d) {
    const i = mode === 'all' ? (d > 0 ? -1 : ORDER.length) : ORDER.indexOf(mode);
    mode = ORDER[(i + d + ORDER.length) % ORDER.length];
    render();
  }

  document.getElementById('switcher').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.step) step(Number(b.dataset.step));
    else if (b.dataset.act === 'all') { mode = mode === 'all' ? 'A' : 'all'; render(); }
    else if (b.dataset.act === 'still') { stillForced = !stillForced; render(); }
  });
  addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea, [contenteditable]')) return;
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });
  let rt = 0;
  addEventListener('resize', () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      const bareNow = innerWidth < 520 && mode !== 'all';
      const bareWas = phones[0] && phones[0].phone.classList.contains('phone--bare');
      if (bareNow !== bareWas || bareNow) render();
      else layout();
    }, 120);
  });
  mq.addEventListener('change', render);

  render();
})();
</script>
</body>
</html>
